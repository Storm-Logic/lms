version: '3.9'

services:
  frontend:
    build:
      context: ./my-react-app
      dockerfile: Dockerfile.dev # this is your frontend Dockerfile
    ports:
      - "3000:5173"  # Vite dev server default
    environment:
      - VITE_BACKEND_URL=http://localhost:8001
      - VITE_CLERK_PUBLISHABLE_KEY=pk_test_d2VsY29tZWQtaGVkZ2Vob2ctMS5jbGVyay5hY2NvdW50cy5kZXYk
    volumes:
      - ./my-react-app:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules

    